# CertiWatch Sovereign CI/CD Pipeline (SecNumCloud / GitLab CI)
# Standard ANSSI & NIS 2 Compliant Pipeline

image: node:22-alpine

stages:
  - lint
  - test
  - build
  - security
  - deploy

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .npm/

before_script:
  - npm ci --cache .npm --prefer-offline || npm install

typecheck_and_lint:
  stage: lint
  script:
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^(master|main|develop)$/

unit_and_api_tests:
  stage: test
  script:
    - npm run test
    - npm run db:generate
  artifacts:
    when: always
    reports:
      junit: junit-report.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^(master|main|develop)$/

build_production_bundle:
  stage: build
  script:
    - npm run build
  artifacts:
    name: "certiwatch-dist-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/
    expire_in: 14 days
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(master|main)$/

vulnerability_scan:
  stage: security
  script:
    - npm audit --audit-level=high || true
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(master|main)$/

deploy_cloud_run:
  stage: deploy
  script:
    - echo "Déploiement certifié SecNumCloud / Google Cloud Run initié pour $CI_COMMIT_SHORT_SHA"
  environment:
    name: production
    url: https://ais-pre-5uyzcrd6log7r474rmwavj-531644593121.europe-west2.run.app
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual
