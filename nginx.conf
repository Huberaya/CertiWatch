# ========================================================
# CertiWatch Production NGINX Reverse Proxy & TLS 1.3
# HSTS Preload, Rate Limiting & Enterprise Security Headers
# ========================================================

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Rate Limiting Zones (DDoS protection)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

    # Upstream Node/Express app running on port 3000
    upstream certiwatch_backend {
        server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # HTTP -> HTTPS Redirection
    server {
        listen 80;
        listen [::]:80;
        server_name certiwatch.io *.certiwatch.io;
        return 301 https://$host$request_uri;
    }

    # Primary HTTPS Server (TLS 1.3 & HSTS)
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name app.certiwatch.io api.certiwatch.io certiwatch.io;

        # SSL Certificates
        ssl_certificate /etc/letsencrypt/live/certiwatch.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/certiwatch.io/privkey.pem;

        # Modern TLS Configuration (Qualys SSL Labs A+)
        ssl_protocols TLSv1.3 TLSv1.2;
        ssl_prefer_server_ciphers off;
        ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        resolver_timeout 5s;

        # Security Headers (ANSSI / OWASP Compliant)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://*.run.app https://*.neon.tech https://generativelanguage.googleapis.com; frame-ancestors 'self';" always;

        # Static Assets Caching (1 Year Immutable)
        location /assets/ {
            alias /app/dist/assets/;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # PWA Manifest & Service Worker (No Cache)
        location ~* (sw\.js|manifest\.webmanifest)$ {
            root /app/dist;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # API & Dynamic Routes Proxy
        location / {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://certiwatch_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }
    }
}
